<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugardoll Clothing Shop</title>
</head>
<body>

<h1>Sugardoll Clothing Shop</h1>

<!-- LOGIN -->
<div id="login-page">
  <h2>Log in</h2>
  <p>Username: <input type="text" id="username"></p>
  <p>Password: <input type="password" id="password"></p>
  <p><button onclick="doLogin()">Log in</button></p>
  <p id="error"></p>
</div>

<!-- LOGGED-IN AREA -->
<div id="app-page" hidden>
  <p>
    Logged in as <b id="who"></b>
    <button onclick="doLogout()">Log out</button>
    <button id="switch-btn" onclick="goToRolePage()" hidden></button>
  </p>
  <hr>

  <div id="customer-view">
    <h2>Shop</h2>
    <ul>
      <li>Floral Sundress - PHP 899</li>
      <li>Denim Jacket - PHP 1,299</li>
      <li>Cotton Tee - PHP 399</li>
    </ul>
    <h3>My orders</h3>
    <p>No orders yet.</p>
  </div>
</div>

<script>
let currentUser = null;

// Ask the server to check the login. Returns { username, role } or null.
async function authenticate(username, password) {
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  return res.ok ? await res.json() : null;
}

async function doLogin() {
  const user = await authenticate(
    document.getElementById("username").value.trim(),
    document.getElementById("password").value
  );
  if (!user) {
    document.getElementById("error").textContent = "Wrong username or password.";
    return;
  }
  showApp(user);
}

function showApp(user) {
  currentUser = user;
  document.getElementById("error").textContent = "";
  document.getElementById("password").value = "";
  document.getElementById("login-page").hidden = true;
  document.getElementById("app-page").hidden = false;
  document.getElementById("who").textContent = user.username + " (" + user.role + ")";

  // Admins and warehouse staff get a button to their own page
  const btn = document.getElementById("switch-btn");
  if (user.role === "admin") {
    btn.textContent = "Go to admin page";
    btn.hidden = false;
  } else if (user.role === "warehouse") {
    btn.textContent = "Go to warehouse page";
    btn.hidden = false;
  } else {
    btn.hidden = true;
  }
}

async function doLogout() {
  await fetch("/api/logout", { method: "POST" });
  currentUser = null;
  document.getElementById("app-page").hidden = true;
  document.getElementById("login-page").hidden = false;
}

// Goes to /admin or /warehouse. The server checks the role again.
function goToRolePage() {
  window.location.href = "/" + currentUser.role;
}

// On page load: if the server still has a session, skip the login screen.
fetch("/api/me").then(res => res.ok ? res.json() : null).then(user => {
  if (user) showApp(user);
});
</script>

</body>
</html>
