<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugardoll Clothings</title>
<link rel="icon" type="image" href="images/SugardollIcon.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="shop">

<!-- LOGIN -->
<div id="login-page" class="split" hidden>
  <div class="split-left">
    <div class="auth-box">
    <img class="logo" id="login-logo" src="/images/sugardollLogo.jpg" alt="Sugardoll logo">
      <h2>Log in to your account</h2>
      <label class="field">Username
        <input type="text" id="username" placeholder="Enter your username">
      </label>
      <label class="field">Password
        <input type="password" id="password" placeholder="Enter your password">
      </label>
      <button id="login-btn" class="primary-btn">Log in</button>
      <p id="error" class="form-error"></p>
      <p>No account yet? <button id="show-register-btn" class="link-btn">Create an account</button></p>
    </div>
  </div>
  <div class="split-right"></div>
</div>

<!-- CREATE ACCOUNT -->
<div id="register-page" class="split" hidden>
  <div class="split-left">
    <div class="auth-box">
      <h1>Sugardoll Clothings</h1>
      <h2>Create an account</h2>
      <label class="field">Username
        <input type="text" id="reg-username" placeholder="Choose a username">
      </label>
      <label class="field">Password
        <input type="password" id="reg-password" placeholder="Choose a password">
      </label>
      <label class="field">Confirm password
        <input type="password" id="reg-confirm" placeholder="Type the password again">
      </label>
      <ul class="hint">
        <li>Username: 3-30 letters, numbers or underscores</li>
        <li>Password: 8 to 72 characters</li>
        <li>At least 1 uppercase letter, 1 lowercase letter, 1 number and 1 symbol</li>
      </ul>
      <button id="register-btn" class="primary-btn">Create account</button>
      <p id="register-error" class="form-error"></p>
      <p>Already have an account? <button id="back-to-login-btn" class="link-btn">Back to log in</button></p>
    </div>
  </div>
  <div class="split-right"></div>
</div>

<!-- LOGGED-IN AREA -->
<div id="app-page" hidden>
  <div class="userbar">
    <div id="guest-bar">
      <button id="open-login-btn" class="login-btn">Log in</button>
    </div>
    <div id="user-bar" hidden>
      Logged in as <b id="who"></b>
      <button id="logout-btn">Log out</button>
      <button id="switch-btn" hidden></button>
    </div>
  </div>

  <div class="topbar">
    <a href="/" class="logo-link"><img class="logo" src="/images/sugardollLogo.jpg" alt="Sugardoll logo"></a>
    <input type="text" id="search" placeholder="Search products">
    <select id="category">
      <option value="">All</option>
      <option value="jeans">Jeans</option>
      <option value="trousers">Trousers</option>
      <option value="tops">Tops</option>
      <option value="others">Others</option>
    </select>
    <button id="cart-btn" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
  </div>

  <div id="customer-view">
    <div id="product-list" class="product-grid"></div>
  </div>

  <div id="product-page" hidden>
    <p><button id="back-btn">&larr; Back to shop</button></p>
    <div id="gallery">
      <button id="prev-btn">&lt;</button>
      <img id="product-img" alt="">
      <button id="next-btn">&gt;</button>
    </div>
    <p id="img-count"></p>
    <h2 id="product-title"></h2>
    <p id="product-desc"></p>
    <p id="product-stock"></p>
    <p><b id="product-price"></b></p>
    <button id="detail-add-btn">Add to cart</button>
  </div>
  
  <!-- CART (slides in from the right) -->
  <div id="cart-overlay" hidden>
    <div id="cart-panel">
      <p class="cart-head"><b>My cart</b> <button id="cart-close-btn">Close</button></p>
      <div id="cart"></div>
      <div id="cart-footer" hidden>
        <b id="cart-total"></b>
        <button id="checkout-btn" class="primary-btn">Checkout</button>
      </div>
    </div>
  </div>

  <!-- REMOVE CONFIRMATION -->
  <div id="confirm-overlay" hidden>
    <div id="confirm-box">
      <p id="confirm-text"></p>
      <button id="confirm-no">Cancel</button>
      <button id="confirm-yes" class="primary-btn">Remove</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>

</body>
</html>
