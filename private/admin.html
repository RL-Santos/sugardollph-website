<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Sugardoll Clothing Shop</title>
<link rel="icon" href="/images/SugardollIcon.jpg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="shop admin">

<aside id="sidebar">
  <a class="side-logo" href="/admin" data-nav><img class="logo" src="/images/sugardollLogo.jpg" alt="Sugardoll logo"></a>
  <nav>
    <a href="/admin" data-nav>Dashboard</a>
    <a href="/admin/users" data-nav>Manage Users</a>
    <a href="/admin/products" data-nav>Manage Products</a>
    <a href="/admin/orders" data-nav>Manage Orders</a>
    <a href="/admin/logs" data-nav>Logs</a>
    <a href="/admin/chats" data-nav>Chats</a>
  </nav>
  <a class="back-link" href="/">&larr; Back to shop</a>
</aside>

<button id="sidebar-toggle" aria-label="Hide or show the menu">&#9776;</button>

<div id="bell-wrap" class="bell-wrap bell-fixed" hidden>
  <button id="bell-btn" class="bell-btn" aria-label="Notifications"><span class="bell-icon"></span><span id="bell-count" hidden></span></button>
  <div id="notif-panel" hidden></div>
</div>

<main id="main"></main>

<div id="confirm-overlay" hidden>
  <div id="confirm-box">
    <p id="confirm-text"></p>
    <button id="confirm-no">Cancel</button>
    <button id="confirm-yes" class="primary-btn">OK</button>
  </div>
</div>

<script src="/js/admin.js"></script>
<script src="/js/notifications.js"></script>
</body>
</html>
